name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify product and plugins
        run: npm run verify

      - name: Check Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token with Workers Scripts, D1, and R2 write access for account 109e58aae44502c4009b0028538fc329."
          exit 1

      - name: Apply D1 migrations
        run: npm exec -- wrangler d1 migrations apply nitrate --remote

      - name: Deploy Worker and assets
        run: npm exec -- wrangler deploy
